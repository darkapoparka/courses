name: Artist hero provider probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: "github.event.head_commit.message == 'chore(reference): probe artist hero provider'"
    runs-on: ubuntu-latest
    steps:
      - name: Download and fingerprint reviewed provider object
        shell: bash
        run: |
          set -euo pipefail
          url='https://mvod.itunes.apple.com/itunes-assets/HLSMusic221/v4/62/67/d2/6267d2b3-8c2f-2f94-b6a7-5387ec4fc51d/P1319234636_Anull_video_gr670_sdr_1920x1080-.mp4'
          curl --fail --location --silent --show-error --output /tmp/artist-hero.mp4 --dump-header /tmp/artist-hero.headers "$url"
          bytes=$(wc -c < /tmp/artist-hero.mp4 | tr -d ' ')
          digest=$(sha256sum /tmp/artist-hero.mp4 | cut -d' ' -f1)
          content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub("\r",""); print $2}' /tmp/artist-hero.headers | tail -1)
          printf 'ARTIST_HERO_BYTES=%s\n' "$bytes"
          printf 'ARTIST_HERO_SHA256=%s\n' "$digest"
          printf 'ARTIST_HERO_CONTENT_TYPE=%s\n' "$content_type"
          test "$bytes" = '13361462'
          test "${digest#0c3684}" != "$digest"
          test "$content_type" = 'video/mp4'
