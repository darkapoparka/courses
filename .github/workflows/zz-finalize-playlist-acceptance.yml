name: Finalize Playlist acceptance

on:
  push:
    branches: ['main']
    paths: ['.github/workflows/zz-finalize-playlist-acceptance.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: finalize-playlist-acceptance
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify the exact parent checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/35610617012" > /tmp/base-run.json
          test "$(jq -r '.head_sha' /tmp/base-run.json)" = '5b3d98d3398a679af3cbd23b15c455a078f6a2a5'
          test "$(jq -r '.status' /tmp/base-run.json)" = 'completed'
          test "$(jq -r '.conclusion' /tmp/base-run.json)" = 'success'
          actual="$(git diff --name-only 8b9f7c4ff8dd1f178f070b13166082ad6fe6a323...5b3d98d3398a679af3cbd23b15c455a078f6a2a5 -- apple-music-clone/app apple-music-clone/components apple-music-clone/lib | sort)"
          expected="$(printf '%s\n' \
            apple-music-clone/components/music-discovery.tsx \
            apple-music-clone/lib/cover-resources.json | sort)"
          test "$actual" = "$expected"

      - name: Apply and validate the reviewed Playlist acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/finalize_playlist_acceptance.py
          python3 .github/scripts/finalize_playlist_acceptance.py
          python3 -m py_compile \
            apple-music-clone/scripts/browser_library_flows.py \
            apple-music-clone/scripts/browser_live_fidelity.py
          node apple-music-clone/scripts/check-reference-archive.mjs
          node apple-music-clone/scripts/check-task-coverage.mjs | tee /tmp/checklist.txt
          grep -F 'UI coded/rendered: 159/159' /tmp/checklist.txt
          grep -F 'Exact visual matches signed off: 65/159' /tmp/checklist.txt
          grep -F 'Full recorded flows signed off: 13/58' /tmp/checklist.txt
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            docs/handoff.md \
            docs/reference-audit.md \
            docs/reference-review/2026-09-21-playlist-acceptance.md \
            docs/tasks.md | sort)"
          printf 'acceptance files:\n%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Publish the acceptance and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          git config user.name 'darkapoparka'
          git config user.email 'obi4amdar4eto@gmail.com'
          git rm \
            .github/workflows/zz-finalize-playlist-acceptance.yml \
            .github/scripts/finalize_playlist_acceptance.py
          git add -- \
            docs/handoff.md \
            docs/reference-audit.md \
            docs/reference-review/2026-09-21-playlist-acceptance.md \
            docs/tasks.md
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/finalize_playlist_acceptance.py \
            .github/workflows/zz-finalize-playlist-acceptance.yml \
            docs/handoff.md \
            docs/reference-audit.md \
            docs/reference-review/2026-09-21-playlist-acceptance.md \
            docs/tasks.md | sort)"
          test "$actual" = "$expected"
          git commit -m 'docs(reference): accept playlist states and flows'
          git push origin HEAD:main
          published_sha="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$published_sha"
          echo "published_sha=${published_sha}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch verification for the published tip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/reference-parity.yml/dispatches" -f ref=main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/astra-docs.yml/dispatches" -f ref=main
