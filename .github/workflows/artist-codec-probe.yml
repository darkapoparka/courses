name: Artist hero codec probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/artist-codec-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    if: "github.event.head_commit.message == 'chore(reference): probe artist hero codec'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Apple playlist variants
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          base='https://mvod.itunes.apple.com/itunes-assets/HLSMusic221/v4/62/67/d2/6267d2b3-8c2f-2f94-b6a7-5387ec4fc51d'
          curl --fail --location --silent --show-error "$base/P1319234636_default.m3u8" -o /tmp/master.m3u8
          printf '%s\n' '=== MASTER PLAYLIST ==='
          cat /tmp/master.m3u8
          for file in \
            P1319234636_Anull_video_gr650_sdr_1280x720-.mp4 \
            P1319234636_Anull_video_gr660_sdr_1280x720-.mp4 \
            P1319234636_Anull_video_gr670_sdr_1920x1080-.mp4
          do
            printf '\n=== %s ===\n' "$file"
            curl --fail --location --silent --show-error --output "/tmp/$file" "$base/$file"
            wc -c "/tmp/$file"
            sha256sum "/tmp/$file"
            ffprobe -v error -show_entries stream=index,codec_name,codec_long_name,profile,codec_tag_string,pix_fmt,width,height,r_frame_rate,avg_frame_rate,color_range,color_space,color_transfer,color_primaries -show_entries format=format_name,duration,size,bit_rate -of json "/tmp/$file"
          done
