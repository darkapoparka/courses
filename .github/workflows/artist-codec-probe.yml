name: Artist hero codec probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/artist-codec-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    if: "github.event.head_commit.message == 'chore(reference): inspect complete artist AVC stream'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect and losslessly remux Apple AVC playlist
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          base='https://mvod.itunes.apple.com/itunes-assets/HLSMusic221/v4/62/67/d2/6267d2b3-8c2f-2f94-b6a7-5387ec4fc51d'
          media="$base/P1319234636_Anull_video_gr265_sdr_1920x1080.m3u8"
          iframe="$base/P1319234636_Anull_trickPlay_gr265_sdr_1920x1080_iframes.m3u8"
          curl --fail --location --silent --show-error "$media" -o /tmp/media.m3u8
          curl --fail --location --silent --show-error "$iframe" -o /tmp/iframe.m3u8
          printf '%s\n' '=== MEDIA PLAYLIST ==='
          cat /tmp/media.m3u8
          printf '%s\n' '=== IFRAME PLAYLIST ==='
          cat /tmp/iframe.m3u8
          printf '%s\n' '=== DIRECT OBJECT ==='
          curl --fail --location --silent --show-error --output /tmp/direct.mp4 "$base/P1319234636_Anull_video_gr265_sdr_1920x1080-.mp4"
          ffprobe -v error -show_entries stream=index,codec_name,profile,codec_tag_string,pix_fmt,width,height,r_frame_rate,avg_frame_rate -show_entries format=format_name,duration,size,bit_rate -of json /tmp/direct.mp4
          printf '%s\n' '=== HLS INPUT ==='
          ffprobe -v error -show_entries stream=index,codec_name,profile,codec_tag_string,pix_fmt,width,height,r_frame_rate,avg_frame_rate -show_entries format=format_name,duration,size,bit_rate -of json "$media"
          printf '%s\n' '=== LOSSLESS REMUX ==='
          ffmpeg -hide_banner -loglevel warning -y -i "$media" -map 0:v:0 -c copy -movflags +faststart /tmp/full-avc.mp4
          wc -c /tmp/full-avc.mp4
          sha256sum /tmp/full-avc.mp4
          ffprobe -v error -show_entries stream=index,codec_name,profile,codec_tag_string,pix_fmt,width,height,r_frame_rate,avg_frame_rate -show_entries format=format_name,duration,size,bit_rate -of json /tmp/full-avc.mp4
          printf '%s\n' '=== PLAYLIST REFERENCES ==='
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          for name in ('media','iframe'):
              text=Path(f'/tmp/{name}.m3u8').read_text()
              print(name)
              for line in text.splitlines():
                  if line and not line.startswith('#'):
                      print(urljoin('https://mvod.itunes.apple.com/itunes-assets/HLSMusic221/v4/62/67/d2/6267d2b3-8c2f-2f94-b6a7-5387ec4fc51d/', line))
          PY
