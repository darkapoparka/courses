name: Publish expanded player acceptance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-expanded-player-acceptance.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Publish reviewed expanded-player acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/publish-expanded-player-acceptance.py
          python3 -m unittest discover -s scripts -p test_astra_docs.py -v
          python3 scripts/check-astra-docs.py
          node apple-music-clone/scripts/check-task-coverage.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-expanded-player-acceptance.yml
          git rm .github/publish-expanded-player-acceptance.py
          git add docs/tasks.md docs/handoff.md docs/reference-review/2026-09-21-expanded-player-repair-candidate.md
          git commit -m 'docs(reference): accept expanded player state'
          git push origin HEAD:main
