name: Reference parity

on:
  push:
    branches: ['astra/course-platform-plan']
    paths: ['apple-music-clone/**', '.github/workflows/reference-parity.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apple-music-clone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate the frozen reference corpus
        run: node scripts/check-reference-archive.mjs
      - name: Install the existing locked application dependencies
        run: npx --yes pnpm@10.11.0 install --frozen-lockfile
      - name: Typecheck the application
        run: npx --yes pnpm@10.11.0 typecheck
      - name: Compile the reference preview
        run: npx --yes pnpm@10.11.0 build
      - name: Install pinned browser tooling
        run: |
          python3 -m venv /tmp/reference-browser
          /tmp/reference-browser/bin/pip install playwright==1.62.0
          /tmp/reference-browser/bin/python -m playwright install --with-deps chromium
      - name: Render every saved state and exercise real controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .parity-evidence/browser
          REFERENCE_PREVIEW=1 HOSTNAME=127.0.0.1 PORT=3000 node node_modules/next/dist/bin/next start > .parity-evidence/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          /tmp/reference-browser/bin/python scripts/browser-reference.py
      - name: Preserve exact candidate and comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-candidate-${{ github.sha }}
          path: apple-music-clone/.parity-evidence/
          include-hidden-files: true
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
