name: Reference parity

on:
  push:
    branches: ['astra/course-platform-plan']
    paths: ['apple-music-clone/**', '.github/workflows/reference-parity.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apple-music-clone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate the frozen reference corpus
        run: node scripts/check-reference-archive.mjs
      - name: Install the existing locked application dependencies
        run: npx --yes pnpm@10.11.0 install --frozen-lockfile
      - name: Typecheck the application
        run: npx --yes pnpm@10.11.0 typecheck
      - name: Compile the reference preview
        run: npx --yes pnpm@10.11.0 build
      - name: Preserve an isolated, secret-free browser inspection workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .parity-evidence
          printf '{"commit":"%s","purpose":"local reference comparison; not a deployment"}\n' "$GITHUB_SHA" > .parity-evidence/candidate.json
          if [ -d node_modules ]; then
            files=(AGENTS.md app components lib scripts node_modules package.json pnpm-lock.yaml tsconfig.json next.config.ts postcss.config.mjs next-env.d.ts reference/originals/flow-screen-map.json reference/originals/*.webp reference/originals/high-resolution/*.webp)
            if [ -d .next ]; then files+=(.next); fi
            tar --exclude='node_modules/.cache' --exclude='.next/cache' --exclude='.next/standalone' -czf .parity-evidence/reference-workspace.tgz "${files[@]}"
          fi
      - name: Preserve exact candidate and comparison inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-candidate-${{ github.sha }}
          path: apple-music-clone/.parity-evidence/
          include-hidden-files: true
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
