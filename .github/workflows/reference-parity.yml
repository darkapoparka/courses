name: Clone verification (not acceptance)

on:
  push:
    branches: ['main']
    paths: ['apple-music-clone/**', 'docs/**', 'AGENTS.md', 'CLAUDE.md', 'README.md', '.github/workflows/reference-parity.yml']
  workflow_dispatch:
    inputs:
      require_acceptance:
        description: Also require all MATCH and FLOW checklist entries
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reference-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  reference:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apple-music-clone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Package the tracked candidate for isolated inspection
        run: |
          mkdir -p .parity-evidence/source
          git archive --format=tar HEAD | gzip -n > .parity-evidence/source/source-tree.tgz
          printf '%s\n' "$GITHUB_SHA" > .parity-evidence/source/commit.txt
      - name: Retain candidate source without credentials or dependency caches
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-source-${{ github.sha }}
          path: apple-music-clone/.parity-evidence/source/
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate the frozen reference corpus
        run: node scripts/check-reference-archive.mjs
      - name: Validate every screen and ordered flow checklist entry
        run: node scripts/check-task-coverage.mjs
      - name: Install the existing locked application dependencies
        run: npx --yes pnpm@10.11.0 install --frozen-lockfile
      - name: Typecheck the application
        run: npx --yes pnpm@10.11.0 typecheck
      - name: Compile the reference preview
        run: npx --yes pnpm@10.11.0 build
      - name: Install pinned browser tooling
        run: |
          python3 -m venv /tmp/reference-browser
          /tmp/reference-browser/bin/pip install -r scripts/requirements-qa.txt
          /tmp/reference-browser/bin/python -m playwright install --with-deps chromium
      - name: Test the comparison tooling
        run: /tmp/reference-browser/bin/python -m unittest discover -s scripts -p test_qa_tools.py
      - name: Render every saved state and exercise real controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .parity-evidence/browser
          REFERENCE_PREVIEW=1 HOSTNAME=127.0.0.1 PORT=3000 node node_modules/next/dist/bin/next start > .parity-evidence/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:3000/ > /dev/null
          /tmp/reference-browser/bin/python scripts/browser-reference.py
      - name: Preserve provider-byte diagnostics on failure
        if: failure()
        run: node scripts/probe-cover-resources.mjs
      - name: Compare all 159 exact-size reference states
        run: /tmp/reference-browser/bin/python scripts/compare-reference.py --output .parity-evidence/comparison
      - name: Optional strict clone acceptance gate
        if: github.event_name == 'workflow_dispatch' && inputs.require_acceptance
        run: node scripts/check-task-coverage.mjs --require-complete
      - name: Preserve exact candidate and comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-candidate-${{ github.sha }}
          path: |
            apple-music-clone/.parity-evidence/browser/
            apple-music-clone/.parity-evidence/comparison/
            apple-music-clone/.parity-evidence/archive-check.json
            apple-music-clone/.parity-evidence/server.log
            apple-music-clone/.parity-evidence/provider-probe-*/
          include-hidden-files: true
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
