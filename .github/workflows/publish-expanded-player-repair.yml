name: Publish expanded player repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-expanded-player-repair.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply verified expanded-player patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/expanded-player-repair.patch
          git apply .github/expanded-player-repair.patch
          python3 -m py_compile \
            apple-music-clone/scripts/browser_expanded_entry.py \
            apple-music-clone/scripts/browser_metadata.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/publish-expanded-player-repair.yml \
            .github/expanded-player-repair.patch
          git add \
            apple-music-clone/app/player-fidelity.css \
            apple-music-clone/components/music-player.tsx \
            apple-music-clone/scripts/browser_expanded_entry.py \
            apple-music-clone/scripts/browser_metadata.py
          git commit -m 'fix(reference): refine expanded player controls'
          git push origin HEAD:main
