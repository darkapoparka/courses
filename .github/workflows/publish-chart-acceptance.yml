name: Publish chart detail acceptance

on:
  push:
    branches: ['main']
    paths: ['.github/workflows/publish-chart-acceptance.yml']

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'ci(reference) stage chart acceptance publisher'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Publish reviewed Chart acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          tasks_path = Path('docs/tasks.md')
          tasks = tasks_path.read_text(encoding='utf-8')

          def sub_once(pattern: str, replacement: str, text: str, *, flags: int = 0) -> str:
              updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'Expected exactly one replacement for {pattern!r}; got {count}')
              return updated

          tasks = sub_once(
              r'^Updated 2026-09-21.*$',
              'Updated 2026-09-21 for the Chart detail exact-state and real-control acceptance review. The verified candidate is `d2dd9e977ec357ee3038c069263b706c9099146b`. **Only checkout: `J:\\courses`; only branch: `main`.** Development remains port 6435.',
              tasks,
              flags=re.MULTILINE,
          )
          tasks = sub_once(
              r'^Implementation checkpoint: .*$',
              'Implementation checkpoint: `d2dd9e977ec357ee3038c069263b706c9099146b` passed 159 desktop states, five responsive states, 218 route checks and 108 registered interaction tests in GitHub Actions run `35619076538`. Exact source/current/residual review accepts `MATCH-8a234785`, and the dedicated named-profile New → Chart journey accepts `FLOW-d5d60236`. [Acceptance review](reference-review/2026-09-21-chart-detail-acceptance.md). MATCH is now 66/159 and FLOW is 14/58.',
              tasks,
              flags=re.MULTILINE,
          )
          tasks = tasks.replace(
              '| Exact visual matches genuinely signed off | **65 / 159** |',
              '| Exact visual matches genuinely signed off | **66 / 159** |',
              1,
          )
          tasks = tasks.replace(
              '| Full recorded flows genuinely signed off | **13 / 58** |',
              '| Full recorded flows genuinely signed off | **14 / 58** |',
              1,
          )
          tasks = sub_once(
              r'^Latest acceptance evidence: .*$',
              'Latest acceptance evidence: [Chart detail exact-state and flow review](reference-review/2026-09-21-chart-detail-acceptance.md). The exact named-profile Chart state and its ordered two-step real-control journey advance after clean source/current/residual, route and interaction review. Current ledger: UI 159/159, MATCH 66/159, FLOW 14/58.',
              tasks,
              flags=re.MULTILINE,
          )

          old_match = '  - [ ] **MATCH-8a234785 — Finish and verify the exact screenshot match.**'
          new_match = '''  - [x] **MATCH-8a234785 — Finish and verify the exact screenshot match.**
            - 2026-09-21: Clean candidate `d2dd9e9` reproduces the exact named-profile Chart content, row order, artwork, saved favourite, unavailable row, sidebar/player state and control geometry. Source/current/residual review records MAE `3.525869` and `3.427541%` over-20; the remaining residual is bounded to lawful browser text, SVG, live material and decoder raster variation. [Evidence](reference-review/2026-09-21-chart-detail-acceptance.md).'''.replace('            -', '  -')
          if old_match not in tasks:
              raise SystemExit('Unchecked Chart MATCH row was not found exactly once')
          tasks = tasks.replace(old_match, new_match, 1)

          old_flow = '- [ ] **FLOW-d5d60236 — 4. Chart detail (2 steps).** Complete and verify the recorded journey.'
          new_flow = '''- [x] **FLOW-d5d60236 — 4. Chart detail (2 steps).** Complete and verify the recorded journey.
            - 2026-09-21: Dedicated `recorded-chart-detail` evidence records `4f611a9e → 8a234785` in source order, clicks the visible Favourite These Viral Hits heading and asserts the 15-row catalog, saved favourite, SmithAlex continuity and `view=chart`. The complete 159/5/218/108 clean-checkout run passes. [Evidence](reference-review/2026-09-21-chart-detail-acceptance.md).'''.replace('            -', '  -')
          if old_flow not in tasks:
              raise SystemExit('Unchecked Chart FLOW row was not found exactly once')
          tasks = tasks.replace(old_flow, new_flow, 1)

          checked_ui = len(re.findall(r'^\s*- \[x\] \*\*UI-', tasks, flags=re.MULTILINE))
          checked_match = len(re.findall(r'^\s*- \[x\] \*\*MATCH-', tasks, flags=re.MULTILINE))
          checked_flow = len(re.findall(r'^\s*- \[x\] \*\*FLOW-', tasks, flags=re.MULTILINE))
          total_match = len(re.findall(r'^\s*- \[[ x]\] \*\*MATCH-', tasks, flags=re.MULTILINE))
          total_flow = len(re.findall(r'^\s*- \[[ x]\] \*\*FLOW-', tasks, flags=re.MULTILINE))
          assert (checked_ui, checked_match, checked_flow, total_match, total_flow) == (159, 66, 14, 159, 58), (
              checked_ui, checked_match, checked_flow, total_match, total_flow
          )
          tasks_path.write_text(tasks, encoding='utf-8')

          handoff_path = Path('docs/handoff.md')
          handoff = handoff_path.read_text(encoding='utf-8')
          marker = '## Current verified implementation\n\n'
          chart_summary = (
              'The Chart detail acceptance batch signs off exact state `8a234785` and complete real-control '
              '`FLOW-d5d60236` on candidate `d2dd9e977ec357ee3038c069263b706c9099146b`. GitHub Actions '
              'run `35619076538` passed 159 canonical desktop states, five responsive states, all 218 route '
              'checks and 108 registered interaction tests with zero failures; all 159 exact-size comparisons '
              'also passed. [Review](reference-review/2026-09-21-chart-detail-acceptance.md).\n\n'
          )
          if chart_summary not in handoff:
              if marker not in handoff:
                  raise SystemExit('Handoff implementation heading not found')
              handoff = handoff.replace(marker, marker + chart_summary, 1)
          handoff = sub_once(
              r'^UI 159/159; MATCH 65/159; FLOW 13/58\..*$',
              'UI 159/159; MATCH 66/159; FLOW 14/58. The Chart review advances one MATCH state and the complete two-step Chart detail journey; the Playlist, ready-flow and album decisions remain accepted. `docs/tasks.md` remains the sole acceptance ledger.',
              handoff,
              flags=re.MULTILINE,
          )
          handoff = sub_once(
              r'^Recompute the dependency report from the updated ledger, then review Chart detail:.*$',
              'Recompute the dependency report from the updated ledger before selecting the next independent family. Do not reopen accepted New, Chart, Home, Replay, account, trial, album or Playlist states solely because lawful platform residuals are non-zero; reopen only for a concrete product mismatch or regression.',
              handoff,
              flags=re.MULTILINE,
          )
          handoff_path.write_text(handoff, encoding='utf-8')

          review = dedent('''\
          # Chart detail exact-state and flow acceptance — 2026-09-21
          
          ## Scope and identity
          
          This review covers `MATCH-8a234785` and `FLOW-d5d60236` only. The verified candidate is `d2dd9e977ec357ee3038c069263b706c9099146b`; no application UI code changed in this acceptance batch. The batch adds a dedicated source-ordered regression and publishes the reviewed evidence already present in the live implementation.
          
          GitHub Actions run `35619076538` produced artifact `reference-candidate-d2dd9e977ec357ee3038c069263b706c9099146b` (artifact `10648925124`, digest `sha256:79d9a24ac8f0160f958ef6a73082aa1db5b62a87da8c2facb8e2bb6fda9e2f2c`).
          
          ## Clean verification
          
          - TypeScript and the production build passed.
          - The frozen archive and every checklist mapping passed.
          - 159 canonical desktop states and five responsive states rendered successfully.
          - All 218 recorded route steps returned their expected states.
          - All 108 registered interaction tests passed with zero failures, including `recorded-chart-detail`.
          - All 159 exact-size source/current comparisons completed successfully.
          
          ## Exact Chart state
          
          The reviewed target is `8a234785-f0b4-4200-8f3f-2eecf2b77708` at 1440×903. Source SHA-256 is `4b3cdf25b3e0b13648f856bf6df30bbee66c02f42f459555972f0e67551c0e53`; current render SHA-256 is `10da5dfd16f02a381e2a614e2151a0e2697b57530c74d5d78f2e48ee84cd8680`.
          
          The fresh comparison records MAE `3.5258692732045445` and `3.4275409130060295%` of pixels over threshold 20. The source, current render and residual are byte-stable against the preceding clean checkpoint. Direct review found the same heading, 15-row order, metadata, artwork identities and crops, saved `stupid song` favourite, unavailable `Kiss It Better` row, SmithAlex profile, selected New sidebar state, idle player and visible control geometry. No concrete product mismatch remains. The residual is confined to lawful Linux/Windows browser text and SVG antialiasing, live glass/material raster and image-decoder variation; it is not hidden by exclusions or a screenshot overlay.
          
          ## Complete real-control journey
          
          The dedicated evidence records exactly the archived two-step order:
          
          1. `4f611a9e-b39b-4ee5-a6b7-fa10fad5f093` — named-profile New, recorded before interaction.
          2. Click the visible **Favourite These Viral Hits** heading control.
          3. `8a234785-f0b4-4200-8f3f-2eecf2b77708` — Chart detail at `/?view=chart`.
          
          The case asserts the New scene and SmithAlex profile before the click, then the Chart scene, exact heading, 15 rows, saved favourite, profile continuity and chart URL after the click. It does not load the endpoint directly after the starting fixture or inject hidden scenario state.
          
          ## Acceptance decision
          
          `MATCH-8a234785` and `FLOW-d5d60236` are accepted. The ledger advances from MATCH 65/159 and FLOW 13/58 to MATCH 66/159 and FLOW 14/58; UI remains 159/159. Numeric residuals remain diagnostic rather than an automatic acceptance rule.
          ''')
          review_path = Path('docs/reference-review/2026-09-21-chart-detail-acceptance.md')
          if review_path.exists():
              raise SystemExit(f'Refusing to overwrite existing review: {review_path}')
          review_path.write_text(review, encoding='utf-8')
          PY
          python3 -m unittest discover -s scripts -p test_astra_docs.py -v
          python3 scripts/check-astra-docs.py
          node apple-music-clone/scripts/check-task-coverage.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tasks.md docs/handoff.md docs/reference-review/2026-09-21-chart-detail-acceptance.md
          git commit -m 'docs(reference): accept chart detail state and flow'
          git push origin HEAD:main
